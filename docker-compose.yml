# One-shot office with YOUR agent-data (never bake secrets into the image).
#
#   AGENT_DATA=/home/box/agent-data docker compose up --build
#   # optional webhook:
#   WEBHOOK_JSON=./webhook.json AGENT_DATA=/home/box/agent-data docker compose up --build
#
services:
  botvillage:
    build: .
    image: botvillage:local
    ports:
      # Host loopback only. Remove 127.0.0.1 if you intentionally open Tailscale.
      - "127.0.0.1:8040:8040"
    environment:
      AGENT_DATA: /data
      # VILLAGE_LOCAL no longer bypasses non-loopback auth (Docker bridge IPs need a token).
      # Host publish stays 127.0.0.1; set a HUD jeton so the browser can pass the gate.
      VILLAGE_LOCAL: "1"
      # VILLAGE_WS_ORIGINS: "http://my-box.tailnet.ts.net:8040"
      # VILLAGE_PROMPT_TOKEN: "set-me"   # required for non-loopback peers; never the webhook key
    volumes:
      # Host path → container /data (set AGENT_DATA env when invoking compose)
      - ${AGENT_DATA:-./agent-data}:/data:ro
      # Optional: real webhook.json (defaults to the committed example = no secrets)
      - ${WEBHOOK_JSON:-./webhook.json.example}:/app/webhook.json:ro
    restart: unless-stopped
