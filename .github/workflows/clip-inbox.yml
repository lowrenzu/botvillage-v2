name: clip-inbox

# Temporary helper: pulls a shared file from Google Drive on a GitHub runner
# (the runner has full internet, the author's sandbox does not) and publishes
# it on the `clip-inbox` branch so it can be fetched with git.
on:
  push:
    paths:
      - ".github/clip-inbox.trigger"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download from Drive
        env:
          DRIVE_ID: ${{ vars.CLIP_DRIVE_ID || '1DUlj-Zvrqq5zRFpI0Ntt3wVoH0O8JSux' }}
          CLIP_NAME: megabass_vision_oneten_short_v3.mp4
        run: |
          mkdir -p .clip-inbox
          LOG=.clip-inbox/download.log
          {
            echo "== gdown version =="
            python3 -m pip install --quiet --disable-pip-version-check gdown 2>&1
            python3 -m gdown --version 2>&1
            echo "== gdown download =="
            timeout 600 python3 -m gdown "https://drive.google.com/uc?id=${DRIVE_ID}" -O ".clip-inbox/${CLIP_NAME}" 2>&1
            echo "gdown_exit=$?"
            echo "== plain curl probe =="
            curl -sSL -o /dev/null -w 'code=%{http_code} size=%{size_download} type=%{content_type}\n' \
              "https://drive.google.com/uc?export=download&id=${DRIVE_ID}" 2>&1
            echo "== files =="
            ls -l .clip-inbox 2>&1
          } | tee "$LOG"
          true

      - name: Split if over the 100 MB git limit
        run: |
          cd .clip-inbox || exit 0
          f=megabass_vision_oneten_short_v3.mp4
          [ -f "$f" ] || exit 0
          size=$(stat -c%s "$f")
          if [ "$size" -gt 94000000 ]; then
            split -b 40M -d -a 3 "$f" part.
            rm -f "$f"
          fi
          ls -l

      - name: Publish on clip-inbox branch
        if: always()
        run: |
          git config user.name "clip-inbox bot"
          git config user.email "clip-inbox@users.noreply.github.com"
          git checkout --orphan clip-inbox-tmp
          git rm -r --cached . >/dev/null 2>&1 || true
          git add -f .clip-inbox
          git commit -m "clip inbox"
          git branch -M clip-inbox
          git push --force origin clip-inbox
